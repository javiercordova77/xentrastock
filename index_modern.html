<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XentraStock - Sistema de Inventario Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': {
                            50: '#EFF6FF',
                            100: '#DBEAFE', 
                            200: '#BFDBFE',
                            300: '#93C5FD',
                            400: '#60A5FA',
                            500: '#3B82F6',  // Nuestro azul principal estándar
                            600: '#2563EB',
                            700: '#1D4ED8',
                            800: '#1E40AF',
                            900: '#1E3A8A'
                        },
                        'slate': {
                            50: '#F8FAFC',
                            100: '#F1F5F9',
                            200: '#E2E8F0',
                            300: '#CBD5E1',
                            400: '#94A3B8',
                            500: '#64748B',
                            600: '#475569',
                            700: '#334155',
                            800: '#1E293B',
                            900: '#0F172A'
                        },
                        'blue': {
                            50: '#EFF6FF',
                            100: '#DBEAFE',
                            200: '#BFDBFE',
                            300: '#93C5FD',
                            400: '#60A5FA',
                            500: '#3B82F6',
                            600: '#2563EB',
                            700: '#1D4ED8',
                            800: '#1E40AF',
                            900: '#1E3A8A'
                        },
                        'red': {
                            50: '#FEF2F2',
                            100: '#FEE2E2',
                            200: '#FECACA',
                            300: '#FCA5A5',
                            400: '#F87171',
                            500: '#EF4444',
                            600: '#DC2626',
                            700: '#B91C1C',
                            800: '#991B1B',
                            900: '#7F1D1D'
                        },
                        'gray': {
                            50: '#F9FAFB',
                            100: '#F3F4F6',
                            200: '#E5E7EB',
                            300: '#D1D5DB',
                            400: '#9CA3AF',
                            500: '#6B7280',
                            600: '#4B5563',
                            700: '#374151',
                            800: '#1F2937',
                            900: '#111827'
                        },
                        'success': {
                            50: '#ECFDF5',
                            100: '#D1FAE5',
                            500: '#10B981',
                            600: '#059669',
                            700: '#047857'
                        },
                        'error': {
                            50: '#FEF2F2',
                            100: '#FEE2E2',
                            500: '#EF4444',
                            600: '#DC2626',
                            700: '#B91C1C'
                        },
                        'warning': {
                            50: '#FFFBEB',
                            100: '#FEF3C7',
                            500: '#F59E0B',
                            600: '#D97706',
                            700: '#B45309'
                        }
                    },
                    fontFamily: {
                        'sans': ['Inter', 'ui-sans-serif', 'system-ui']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--xs-bg);
            color: var(--xs-text);
        }
        
        /* Sidebar con estándar corporativo */
        .sidebar-gradient {
            background-color: var(--xs-primary);
        }
        
        /* Efectos estándar */
        .card-shadow {
            box-shadow: var(--xs-shadow-md);
        }
        .hover-lift {
            transition: var(--xs-transition);
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: var(--xs-shadow-lg);
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sidebar-collapsed {
            width: 5rem;
        }
        .sidebar-expanded {
            width: 16rem;
        }
        .content-collapsed {
            margin-left: 5rem;
        }
        .content-expanded {
            margin-left: 16rem;
        }
        @media (max-width: 768px) {
            .sidebar-collapsed, .sidebar-expanded {
                width: 100%;
                transform: translateX(-100%);
            }
            .sidebar-mobile-open {
                transform: translateX(0) !important;
            }
            .content-collapsed, .content-expanded {
                margin-left: 0;
            }
            /* Prevenir scroll del body cuando el menú móvil está abierto */
            body.mobile-menu-open {
                overflow: hidden;
            }
        }
    </style>
</head>
<body class="bg-gray-50" x-data="appData()" x-init="init()">
    <!-- Mobile Sidebar Overlay -->
    <div x-show="isMobileMenuOpen" 
         x-transition:enter="transition-opacity ease-linear duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-300"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-gray-600 bg-opacity-75 z-20 md:hidden"
         @click="isMobileMenuOpen = false"></div>

    <!-- Sidebar -->
        <!-- Sidebar -->
    <div class="fixed inset-y-0 left-0 z-50 bg-slate-900 shadow-xl transition-all duration-300 ease-in-out sidebar"
         :class="{
             'sidebar-expanded': !isSidebarCollapsed && !isMobile,
             'sidebar-collapsed': isSidebarCollapsed && !isMobile,
             'sidebar-mobile-open': isMobileMenuOpen && isMobile
         }"
         x-show="isMobileMenuOpen || !isMobile" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="-translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="-translate-x-full"
         @click.away="isMobile && (isMobileMenuOpen = false)">
        
        <!-- Sidebar Content -->
        <div class="flex flex-col h-full" @click.stop="">
            <!-- Header -->
            <div class="flex items-center justify-between h-16 px-4 border-b border-slate-700">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-md">
                        <i class="fas fa-boxes text-white text-lg"></i>
                    </div>
                    <span x-show="!isSidebarCollapsed || isMobile" 
                          x-transition
                          class="text-xl font-bold text-white tracking-tight">XentraStock</span>
                </div>
                <button @click="toggleSidebar()" 
                        class="text-slate-300 hover:text-white hover:bg-slate-700 p-2 rounded-lg transition-all duration-200 hidden md:block">
                    <i class="fas fa-bars text-sm"></i>
                </button>
                <button @click.stop="isMobileMenuOpen = false" 
                        class="text-slate-300 hover:text-white hover:bg-slate-700 p-2 rounded-lg transition-all duration-200 md:hidden">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
                <template x-for="item in menuItems" :key="item.id">
                    <div>
                        <button @click.stop="setActiveModule(item.id)"
                                class="group flex items-center w-full px-3 py-3 text-sm font-medium rounded-xl transition-all duration-200 relative"
                                :class="activeModule === item.id ? 
                                    'bg-blue-600 text-white shadow-lg transform scale-[1.02]' : 
                                    'text-slate-300 hover:text-white hover:bg-slate-700/70 hover:transform hover:scale-[1.01]'">
                            <i :class="item.icon" 
                               class="flex-shrink-0 w-5 h-5 transition-colors duration-200"
                               :class="activeModule === item.id ? 'text-white' : 'text-slate-400 group-hover:text-blue-400'"></i>
                            <span x-show="!isSidebarCollapsed || isMobile" 
                                  x-transition
                                  class="ml-3 font-medium" x-text="item.name"></span>
                            <span x-show="item.badge && (!isSidebarCollapsed || isMobile)" 
                                  x-transition
                                  class="ml-auto bg-red-500 text-white text-xs px-2 py-1 rounded-full font-bold shadow-sm"
                                  x-text="item.badge"></span>
                            <!-- Active indicator -->
                            <div x-show="activeModule === item.id"
                                 class="absolute left-0 top-0 bottom-0 w-1 bg-blue-300 rounded-r-full"></div>
                        </button>
                    </div>
                </template>
            </nav>

            <!-- User Info -->
            <div class="border-t border-slate-700 p-4">
                <div class="flex items-center space-x-3 p-3 rounded-xl bg-slate-800/50 hover:bg-slate-700/50 transition-all duration-200 cursor-pointer">
                    <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-blue-600 rounded-full flex items-center justify-center shadow-md">
                        <i class="fas fa-user text-white text-sm"></i>
                    </div>
                    <div x-show="!isSidebarCollapsed || isMobile" 
                         x-transition
                         class="flex-1 min-w-0">
                        <p class="text-sm font-semibold text-white truncate">Usuario Admin</p>
                        <p class="text-xs text-slate-400 truncate">Administrador del Sistema</p>
                    </div>
                    <div x-show="!isSidebarCollapsed || isMobile" 
                         x-transition
                         class="text-slate-400 hover:text-white transition-colors duration-200">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="transition-all duration-300 ease-in-out"
         :class="[
             isMobile ? '' : (isSidebarCollapsed ? 'content-collapsed' : 'content-expanded')
         ]">
        <!-- Top Bar -->
        <header class="bg-white shadow-sm border-b border-gray-200">
            <div class="flex items-center justify-between h-16 px-4 lg:px-6">
                <div class="flex items-center space-x-4">
                    <button @click="toggleMobileMenu()" 
                            class="text-gray-500 hover:text-gray-600 md:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors">
                        <i class="fas fa-bars text-lg"></i>
                    </button>
                    <div>
                        <h1 class="text-xl font-semibold text-gray-900" x-text="currentModuleTitle"></h1>
                        <p class="text-sm text-gray-500" x-text="currentModuleDescription"></p>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <!-- Search -->
                    <div class="hidden lg:block">
                        <div class="relative">
                            <input type="text" 
                                   placeholder="Buscar..."
                                   class="w-80 pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                            <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>
                    
                    <!-- Notifications -->
                    <button class="relative p-2 text-gray-500 hover:text-gray-600 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-bell text-lg"></i>
                        <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">3</span>
                    </button>
                    
                    <!-- Settings -->
                    <button class="p-2 text-gray-500 hover:text-gray-600 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-cog text-lg"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="p-4 lg:p-6">
            <div class="animate-fade-in">
                <!-- Dashboard Module -->
                <div x-show="activeModule === 'dashboard'" x-transition>
                    <div id="dashboard-content">
                        <!-- Dashboard content will be loaded here -->
                    </div>
                </div>

                <!-- Proveedores Module -->
                <div x-show="activeModule === 'proveedores'" x-transition>
                    <div id="proveedores-content">
                        <!-- Proveedores content will be loaded here -->
                    </div>
                </div>

                <!-- Categorías Module -->
                <div x-show="activeModule === 'categorias'" x-transition>
                    <div id="categorias-content">
                        <!-- Categorías content will be loaded here -->
                    </div>
                </div>

                <!-- Productos Module -->
                <div x-show="activeModule === 'productos'" x-transition>
                    <div id="productos-content">
                        <!-- Productos content will be loaded here -->
                    </div>
                </div>

                <!-- Variantes Module -->
                <div x-show="activeModule === 'variantes'" x-transition>
                    <div id="variantes-content">
                        <!-- Variantes content will be loaded here -->
                    </div>
                </div>

                <!-- Ubicaciones Module -->
                <div x-show="activeModule === 'ubicaciones'" x-transition>
                    <div id="ubicaciones-content">
                        <!-- Ubicaciones content will be loaded here -->
                    </div>
                </div>

                <!-- Inventario Module -->
                <div x-show="activeModule === 'inventario'" x-transition>
                    <div id="inventario-content">
                        <!-- Inventario content will be loaded here -->
                    </div>
                </div>

                <!-- Movimientos Module -->
                <div x-show="activeModule === 'movimientos'" x-transition>
                    <div id="movimientos-content">
                        <!-- Movimientos content will be loaded here -->
                    </div>
                </div>

                <!-- Transferencias Module -->
                <div x-show="activeModule === 'transferencias'" x-transition>
                    <div id="transferencias-content">
                        <!-- Transferencias content will be loaded here -->
                    </div>
                </div>

                <!-- Reportes Module -->
                <div x-show="activeModule === 'reportes'" x-transition>
                    <div id="reportes-content">
                        <!-- Reportes content will be loaded here -->
                    </div>
                </div>

                <!-- Configuración Module -->
                <div x-show="activeModule === 'configuracion'" x-transition>
                    <div id="configuracion-content">
                        <!-- Configuración content will be loaded here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div x-show="isLoading" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 shadow-xl">
            <div class="flex items-center space-x-4">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary-600"></div>
                <span class="text-lg font-medium text-gray-900">Cargando...</span>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div x-show="toast.show" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 transform translate-y-2"
         x-transition:enter-end="opacity-100 transform translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 transform translate-y-0"
         x-transition:leave-end="opacity-0 transform translate-y-2"
         class="fixed top-4 right-4 z-50">
        <div class="bg-white rounded-lg shadow-lg border-l-4 p-4 max-w-md"
             :class="{
                 'border-green-500': toast.type === 'success',
                 'border-red-500': toast.type === 'error',
                 'border-yellow-500': toast.type === 'warning',
                 'border-primary-500': toast.type === 'info'
             }">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <i :class="{
                        'fas fa-check-circle text-green-500': toast.type === 'success',
                        'fas fa-exclamation-circle text-red-500': toast.type === 'error',
                        'fas fa-exclamation-triangle text-yellow-500': toast.type === 'warning',
                        'fas fa-info-circle text-primary-500': toast.type === 'info'
                    }"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium text-gray-900" x-text="toast.title"></p>
                    <p class="text-sm text-gray-500" x-text="toast.message"></p>
                </div>
                <button @click="hideToast()" class="ml-4 text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2">
        <div x-show="toast.show" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 transform translate-x-full"
             x-transition:enter-end="opacity-100 transform translate-x-0"
             x-transition:leave="transition ease-in duration-300"
             x-transition:leave-start="opacity-100 transform translate-x-0"
             x-transition:leave-end="opacity-0 transform translate-x-full"
             class="max-w-sm w-full border rounded-lg shadow-lg p-4"
             :class="{
                'bg-green-50 border-green-200 text-green-800': toast.type === 'success',
                'bg-red-50 border-red-200 text-red-800': toast.type === 'error',
                'bg-yellow-50 border-yellow-200 text-yellow-800': toast.type === 'warning',
                'bg-primary-50 border-primary-200 text-primary-800': toast.type === 'info'
             }">
            <div class="flex justify-between items-start">
                <div class="flex-1">
                    <h4 x-show="toast.title" x-text="toast.title" class="font-medium text-sm"></h4>
                    <p x-show="toast.message" x-text="toast.message" class="text-sm mt-1"></p>
                </div>
                <button @click="hideToast()" class="ml-2 flex-shrink-0">
                    <i class="fas fa-times text-xs opacity-70 hover:opacity-100"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/proveedores.js"></script>
    <script src="js/modules/categorias.js"></script>
    <script src="js/modules/productos.js"></script>
    <script src="js/modules/variantes.js"></script>
    <script src="js/modules/ubicaciones.js"></script>
    <script src="js/modules/inventario.js"></script>
    <script src="js/modules/movimientos.js"></script>
    <script src="js/modules/transferencias.js"></script>
    <script src="js/modules/reportes.js"></script>
    <script src="js/modules/configuracion.js"></script>
</body>
</html>
