{% extends "base.html" %}

{% block title %}{{ 'Editar' if proveedor else 'Nuevo' }} Proveedor - Xentrastock{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Editar' if proveedor else 'Nuevo' }} Proveedor</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" name="nombre" class="form-control" value="{{ proveedor.nombre if proveedor else '' }}" required>
        </div>

        <div class="form-group">
            <label for="rfc">RFC</label>
            <input type="text" id="rfc" name="rfc" class="form-control" value="{{ proveedor.rfc if proveedor else '' }}" maxlength="13">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" name="telefono" class="form-control" value="{{ proveedor.telefono if proveedor else '' }}">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ proveedor.email if proveedor else '' }}">
            </div>
        </div>

        <div class="form-group">
            <label for="direccion">Dirección</label>
            <textarea id="direccion" name="direccion" class="form-control" rows="3">{{ proveedor.direccion if proveedor else '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="contacto">Persona de Contacto</label>
            <input type="text" id="contacto" name="contacto" class="form-control" value="{{ proveedor.contacto if proveedor else '' }}">
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="activo" {{ 'checked' if not proveedor or proveedor.activo else '' }}>
                Activo
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('proveedores_list') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
