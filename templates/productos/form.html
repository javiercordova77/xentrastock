{% extends "base.html" %}

{% block title %}{{ 'Editar' if producto else 'Nuevo' }} Producto - Xentrastock{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Editar' if producto else 'Nuevo' }} Producto</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="codigo">Código *</label>
                <input type="text" id="codigo" name="codigo" class="form-control" value="{{ producto.codigo if producto else '' }}" required>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" class="form-control" value="{{ producto.nombre if producto else '' }}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" class="form-control" rows="3">{{ producto.descripcion if producto else '' }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="categoria_id">Categoría</label>
                <select id="categoria_id" name="categoria_id" class="form-control">
                    <option value="">Seleccione...</option>
                    {% for categoria in categorias %}
                    <option value="{{ categoria.id }}" {{ 'selected' if producto and producto.categoria_id == categoria.id else '' }}>
                        {{ categoria.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="proveedor_id">Proveedor</label>
                <select id="proveedor_id" name="proveedor_id" class="form-control">
                    <option value="">Seleccione...</option>
                    {% for proveedor in proveedores %}
                    <option value="{{ proveedor.id }}" {{ 'selected' if producto and producto.proveedor_id == proveedor.id else '' }}>
                        {{ proveedor.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="precio_compra">Precio de Compra</label>
                <input type="number" step="0.01" id="precio_compra" name="precio_compra" class="form-control" value="{{ producto.precio_compra if producto else '0.00' }}">
            </div>

            <div class="form-group">
                <label for="precio_venta">Precio de Venta</label>
                <input type="number" step="0.01" id="precio_venta" name="precio_venta" class="form-control" value="{{ producto.precio_venta if producto else '0.00' }}">
            </div>

            <div class="form-group">
                <label for="unidad_medida">Unidad de Medida</label>
                <input type="text" id="unidad_medida" name="unidad_medida" class="form-control" value="{{ producto.unidad_medida if producto else 'PZA' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="stock_minimo">Stock Mínimo</label>
                <input type="number" id="stock_minimo" name="stock_minimo" class="form-control" value="{{ producto.stock_minimo if producto else '0' }}">
            </div>

            <div class="form-group">
                <label for="stock_maximo">Stock Máximo</label>
                <input type="number" id="stock_maximo" name="stock_maximo" class="form-control" value="{{ producto.stock_maximo if producto else '100' }}">
            </div>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="activo" {{ 'checked' if not producto or producto.activo else '' }}>
                Activo
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('productos_list') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
