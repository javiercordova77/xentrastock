{% extends "base.html" %}

{% block title %}{{ 'Editar' if categoria else 'Nueva' }} Categoría - Xentrastock{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Editar' if categoria else 'Nueva' }} Categoría</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" name="nombre" class="form-control" value="{{ categoria.nombre if categoria else '' }}" required>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" class="form-control" rows="4">{{ categoria.descripcion if categoria else '' }}</textarea>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="activo" {{ 'checked' if not categoria or categoria.activo else '' }}>
                Activo
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('categorias_list') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
