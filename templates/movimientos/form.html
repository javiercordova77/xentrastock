{% extends "base.html" %}

{% block title %}Nuevo Movimiento - Xentrastock{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Nuevo Movimiento de Inventario</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="tipo">Tipo de Movimiento *</label>
            <select id="tipo" name="tipo" class="form-control" required>
                <option value="">Seleccione...</option>
                <option value="ENTRADA">Entrada</option>
                <option value="SALIDA">Salida</option>
                <option value="AJUSTE">Ajuste</option>
            </select>
        </div>

        <div class="form-group">
            <label for="producto_id">Producto *</label>
            <select id="producto_id" name="producto_id" class="form-control" required>
                <option value="">Seleccione un producto...</option>
                {% for producto in productos %}
                <option value="{{ producto.id }}">
                    {{ producto.codigo }} - {{ producto.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="variante_id">Variante (Opcional)</label>
            <select id="variante_id" name="variante_id" class="form-control">
                <option value="">Ninguna</option>
                {% for variante in variantes %}
                <option value="{{ variante.id }}">
                    {{ variante.codigo }} - {{ variante.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="ubicacion_id">Ubicación *</label>
            <select id="ubicacion_id" name="ubicacion_id" class="form-control" required>
                <option value="">Seleccione una ubicación...</option>
                {% for ubicacion in ubicaciones %}
                <option value="{{ ubicacion.id }}">
                    {{ ubicacion.codigo }} - {{ ubicacion.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="cantidad">Cantidad *</label>
            <input type="number" id="cantidad" name="cantidad" class="form-control" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="motivo">Motivo</label>
                <input type="text" id="motivo" name="motivo" class="form-control" placeholder="Ej: Compra, Venta, Ajuste por inventario">
            </div>

            <div class="form-group">
                <label for="referencia">Referencia</label>
                <input type="text" id="referencia" name="referencia" class="form-control" placeholder="Ej: Orden #123">
            </div>
        </div>

        <div class="form-group">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" class="form-control" value="Sistema">
        </div>

        <div class="form-group">
            <label for="notas">Notas</label>
            <textarea id="notas" name="notas" class="form-control" rows="3"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Registrar Movimiento</button>
            <a href="{{ url_for('movimientos_list') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
