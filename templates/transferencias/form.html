{% extends "base.html" %}

{% block title %}Nueva Transferencia - Xentrastock{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Nueva Transferencia entre Ubicaciones</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="producto_id">Producto *</label>
            <select id="producto_id" name="producto_id" class="form-control" required>
                <option value="">Seleccione un producto...</option>
                {% for producto in productos %}
                <option value="{{ producto.id }}">
                    {{ producto.codigo }} - {{ producto.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="variante_id">Variante (Opcional)</label>
            <select id="variante_id" name="variante_id" class="form-control">
                <option value="">Ninguna</option>
                {% for variante in variantes %}
                <option value="{{ variante.id }}">
                    {{ variante.codigo }} - {{ variante.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="ubicacion_origen_id">Ubicación Origen *</label>
                <select id="ubicacion_origen_id" name="ubicacion_origen_id" class="form-control" required>
                    <option value="">Seleccione...</option>
                    {% for ubicacion in ubicaciones %}
                    <option value="{{ ubicacion.id }}">
                        {{ ubicacion.codigo }} - {{ ubicacion.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="ubicacion_destino_id">Ubicación Destino *</label>
                <select id="ubicacion_destino_id" name="ubicacion_destino_id" class="form-control" required>
                    <option value="">Seleccione...</option>
                    {% for ubicacion in ubicaciones %}
                    <option value="{{ ubicacion.id }}">
                        {{ ubicacion.codigo }} - {{ ubicacion.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="cantidad">Cantidad *</label>
            <input type="number" id="cantidad" name="cantidad" class="form-control" required min="1">
        </div>

        <div class="form-group">
            <label for="usuario_solicita">Usuario que Solicita</label>
            <input type="text" id="usuario_solicita" name="usuario_solicita" class="form-control" value="Sistema">
        </div>

        <div class="form-group">
            <label for="notas">Notas</label>
            <textarea id="notas" name="notas" class="form-control" rows="3"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Crear Transferencia</button>
            <a href="{{ url_for('transferencias_list') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
