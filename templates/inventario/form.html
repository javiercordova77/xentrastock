{% extends "base.html" %}

{% block title %}{{ 'Editar' if inventario else 'Nuevo' }} Registro de Inventario - Xentrastock{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Editar' if inventario else 'Nuevo' }} Registro de Inventario</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="producto_id">Producto *</label>
            <select id="producto_id" name="producto_id" class="form-control" required>
                <option value="">Seleccione un producto...</option>
                {% for producto in productos %}
                <option value="{{ producto.id }}" {{ 'selected' if inventario and inventario.producto_id == producto.id else '' }}>
                    {{ producto.codigo }} - {{ producto.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="variante_id">Variante (Opcional)</label>
            <select id="variante_id" name="variante_id" class="form-control">
                <option value="">Ninguna</option>
                {% for variante in variantes %}
                <option value="{{ variante.id }}" {{ 'selected' if inventario and inventario.variante_id == variante.id else '' }}>
                    {{ variante.codigo }} - {{ variante.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="ubicacion_id">Ubicación *</label>
            <select id="ubicacion_id" name="ubicacion_id" class="form-control" required>
                <option value="">Seleccione una ubicación...</option>
                {% for ubicacion in ubicaciones %}
                <option value="{{ ubicacion.id }}" {{ 'selected' if inventario and inventario.ubicacion_id == ubicacion.id else '' }}>
                    {{ ubicacion.codigo }} - {{ ubicacion.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="cantidad">Cantidad *</label>
                <input type="number" id="cantidad" name="cantidad" class="form-control" value="{{ inventario.cantidad if inventario else '0' }}" required>
            </div>

            <div class="form-group">
                <label for="lote">Lote</label>
                <input type="text" id="lote" name="lote" class="form-control" value="{{ inventario.lote if inventario else '' }}">
            </div>
        </div>

        <div class="form-group">
            <label for="fecha_vencimiento">Fecha de Vencimiento</label>
            <input type="date" id="fecha_vencimiento" name="fecha_vencimiento" class="form-control" value="{{ inventario.fecha_vencimiento.strftime('%Y-%m-%d') if inventario and inventario.fecha_vencimiento else '' }}">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('inventario_list') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
