<!DOCTYPE html>
<html>
<head>
    <title>Test Inventario Console</title>
</head>
<body>
    <h1>Test Console</h1>
    <div id="resultado"></div>

    <script>
        console.log('🔄 Iniciando test de inventario...');
        
        // Test 1: Verificar que el endpoint responde
        fetch('http://localhost:3001/api/inventario-legacy/inventario-legacy')
            .then(response => {
                console.log('✅ Respuesta del servidor:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('✅ Datos recibidos:', data);
                console.log('📊 Cantidad de items:', data.data ? data.data.length : 0);
                document.getElementById('resultado').innerHTML = `
                    <h2>Resultado del Test:</h2>
                    <p><strong>Estado:</strong> ${data.isOk ? 'OK' : 'ERROR'}</p>
                    <p><strong>Items:</strong> ${data.data ? data.data.length : 0}</p>
                    <p><strong>Stock total:</strong> ${data.totales ? data.totales.stock_total : 0}</p>
                    <p><strong>Valor total:</strong> $${data.totales ? data.totales.valor_total : 0}</p>
                    <pre>${JSON.stringify(data.data ? data.data[0] : {}, null, 2)}</pre>
                    <hr>
                    <button onclick="window.open('http://localhost:3000', '_blank')">🔗 Abrir App Principal</button>
                    <button onclick="location.reload()">🔄 Recargar Test</button>
                `;
            })
            .catch(error => {
                console.error('❌ Error:', error);
                document.getElementById('resultado').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            });
    </script>
    <script src="test-inventario-debug.js"></script>
</body>
</html>
