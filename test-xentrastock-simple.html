<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test XentraStock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">
            <i class="fas fa-boxes text-blue-600 mr-3"></i>
            Test XentraStock 3.0
        </h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Estado de los Servicios</h2>
            <div id="service-status" class="space-y-2">
                <p>🔄 Verificando servicios...</p>
            </div>
        </div>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Test de APIs</h2>
            <div id="api-status" class="space-y-2">
                <p>🔄 Probando endpoints...</p>
            </div>
        </div>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Test de JavaScript</h2>
            <div id="js-status" class="space-y-2">
                <p>🔄 Verificando funciones...</p>
            </div>
        </div>
        
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Simulación de Interfaz</h2>
            <div class="flex space-x-4 mb-4">
                <button id="test-dashboard" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Dashboard
                </button>
                <button id="test-inventario" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                    Inventario  
                </button>
                <button id="test-proveedores" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">
                    Proveedores
                </button>
            </div>
            <div id="content-test" class="bg-gray-50 p-4 rounded">
                <p class="text-gray-600">Haz clic en un botón para simular navegación</p>
            </div>
        </div>
    </div>

    <script>
        console.log('🚀 Iniciando test de XentraStock...');
        
        // Test 1: Verificar servicios
        async function testServices() {
            const statusDiv = document.getElementById('service-status');
            statusDiv.innerHTML = '';
            
            try {
                // Test Frontend
                const frontendResponse = await fetch('http://localhost:3000');
                if (frontendResponse.ok) {
                    statusDiv.innerHTML += '<p class="text-green-600">✅ Frontend (3000): FUNCIONANDO</p>';
                } else {
                    statusDiv.innerHTML += '<p class="text-red-600">❌ Frontend (3000): ERROR</p>';
                }
                
                // Test Backend
                const backendResponse = await fetch('http://localhost:3001/health');
                const backendData = await backendResponse.json();
                statusDiv.innerHTML += '<p class="text-green-600">✅ Backend (3001): ' + backendData.message + '</p>';
                
            } catch (error) {
                statusDiv.innerHTML += '<p class="text-red-600">❌ Error: ' + error.message + '</p>';
            }
        }
        
        // Test 2: Verificar APIs
        async function testAPIs() {
            const statusDiv = document.getElementById('api-status');
            statusDiv.innerHTML = '';
            
            const endpoints = [
                { name: 'Proveedores', url: 'http://localhost:3001/api/proveedores' },
                { name: 'Ubicaciones', url: 'http://localhost:3001/api/ubicaciones' },
                { name: 'Inventario', url: 'http://localhost:3001/api/inventario-legacy/inventario-legacy' }
            ];
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(endpoint.url);
                    const data = await response.json();
                    const count = data.data ? data.data.length : 0;
                    statusDiv.innerHTML += `<p class="text-green-600">✅ ${endpoint.name}: ${count} registros</p>`;
                } catch (error) {
                    statusDiv.innerHTML += `<p class="text-red-600">❌ ${endpoint.name}: ERROR</p>`;
                }
            }
        }
        
        // Test 3: Cargar y verificar archivos JS
        async function testJavaScript() {
            const statusDiv = document.getElementById('js-status');
            statusDiv.innerHTML = '';
            
            try {
                // Intentar cargar inventario.js
                const response = await fetch('http://localhost:3000/js/inventario.js');
                const jsContent = await response.text();
                
                if (jsContent.includes('getInventarioHTML')) {
                    statusDiv.innerHTML += '<p class="text-green-600">✅ inventario.js: getInventarioHTML encontrada</p>';
                } else {
                    statusDiv.innerHTML += '<p class="text-red-600">❌ inventario.js: getInventarioHTML no encontrada</p>';
                }
                
                if (jsContent.includes('initInventario')) {
                    statusDiv.innerHTML += '<p class="text-green-600">✅ inventario.js: initInventario encontrada</p>';
                } else {
                    statusDiv.innerHTML += '<p class="text-red-600">❌ inventario.js: initInventario no encontrada</p>';
                }
                
                if (jsContent.includes('inventario-legacy')) {
                    statusDiv.innerHTML += '<p class="text-green-600">✅ inventario.js: endpoint correcto configurado</p>';
                } else {
                    statusDiv.innerHTML += '<p class="text-orange-600">⚠️ inventario.js: endpoint legacy no encontrado</p>';
                }
                
            } catch (error) {
                statusDiv.innerHTML += '<p class="text-red-600">❌ Error cargando JS: ' + error.message + '</p>';
            }
        }
        
        // Test 4: Simulación de navegación
        function setupNavigation() {
            const contentDiv = document.getElementById('content-test');
            
            document.getElementById('test-dashboard').addEventListener('click', () => {
                contentDiv.innerHTML = `
                    <h3 class="font-semibold text-blue-600 mb-2">Dashboard Simulado</h3>
                    <p>Esta sería la vista del dashboard</p>
                    <div class="grid grid-cols-3 gap-4 mt-4">
                        <div class="bg-blue-100 p-3 rounded text-center">
                            <div class="text-2xl font-bold text-blue-600">8</div>
                            <div class="text-sm text-blue-600">Productos</div>
                        </div>
                        <div class="bg-green-100 p-3 rounded text-center">
                            <div class="text-2xl font-bold text-green-600">17</div>
                            <div class="text-sm text-green-600">Variantes</div>
                        </div>
                        <div class="bg-red-100 p-3 rounded text-center">
                            <div class="text-2xl font-bold text-red-600">3</div>
                            <div class="text-sm text-red-600">Stock Bajo</div>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('test-inventario').addEventListener('click', async () => {
                contentDiv.innerHTML = '<p class="text-gray-600">🔄 Cargando inventario...</p>';
                
                try {
                    const response = await fetch('http://localhost:3001/api/inventario-legacy/inventario-legacy');
                    const data = await response.json();
                    
                    if (data.data && data.data.length > 0) {
                        const items = data.data.slice(0, 3); // Primeros 3 items
                        let html = '<h3 class="font-semibold text-green-600 mb-2">Inventario Real</h3>';
                        html += '<div class="space-y-2">';
                        
                        items.forEach(item => {
                            html += `
                                <div class="bg-green-50 p-2 rounded text-sm">
                                    <strong>${item.varianteSku}</strong> - ${item.ubicacionNombre}: ${item.cantidad} unidades
                                </div>
                            `;
                        });
                        
                        html += `</div><p class="text-sm text-gray-600 mt-2">Total: ${data.data.length} items en inventario</p>`;
                        contentDiv.innerHTML = html;
                    } else {
                        contentDiv.innerHTML = '<p class="text-red-600">❌ No se encontraron datos de inventario</p>';
                    }
                } catch (error) {
                    contentDiv.innerHTML = '<p class="text-red-600">❌ Error: ' + error.message + '</p>';
                }
            });
            
            document.getElementById('test-proveedores').addEventListener('click', async () => {
                contentDiv.innerHTML = '<p class="text-gray-600">🔄 Cargando proveedores...</p>';
                
                try {
                    const response = await fetch('http://localhost:3001/api/proveedores');
                    const data = await response.json();
                    
                    if (data.data && data.data.length > 0) {
                        let html = '<h3 class="font-semibold text-purple-600 mb-2">Proveedores</h3>';
                        html += '<div class="space-y-2">';
                        
                        data.data.forEach(item => {
                            html += `
                                <div class="bg-purple-50 p-2 rounded text-sm">
                                    <strong>${item.nombre}</strong> - ${item.contacto || 'Sin contacto'}
                                </div>
                            `;
                        });
                        
                        html += '</div>';
                        contentDiv.innerHTML = html;
                    } else {
                        contentDiv.innerHTML = '<p class="text-red-600">❌ No se encontraron proveedores</p>';
                    }
                } catch (error) {
                    contentDiv.innerHTML = '<p class="text-red-600">❌ Error: ' + error.message + '</p>';
                }
            });
        }
        
        // Ejecutar todos los tests
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('📋 Ejecutando tests...');
            
            await testServices();
            await testAPIs();
            await testJavaScript();
            setupNavigation();
            
            console.log('✅ Tests completados');
        });
    </script>
</body>
</html>
