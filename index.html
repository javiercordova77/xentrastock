    <!-- Enhanced JavaScript App -->
    <script>
        // Global app state with enhanced features
        const app = {
            currentSection: 'dashboard',
            data: [],
            isLoading: false,
            sdk: null,
            stats: {
                totalProductos: 0,
                totalVariantes: 0,
                stockBajo: 0,
                movimientosHoy: 0
            },
            quickActionsVisible: false
        };

        // Initialize the application
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Inicializando XentraStock 3.0...');
            
            try {
                // Show loading
                setLoading(true);
                
                // Initialize SDK
                await initializeSDK();
                
                // Setup event listeners
                setupEventListeners();
                
                // Load initial dashboard
                await loadSection('dashboard');
                
                // Update stats immediately and then periodically
                await updateStats();
                setInterval(updateStats, 30000); // Every 30 seconds
                
                console.log('✅ XentraStock 3.0 inicializado correctamente');
                showToast('Sistema inicializado correctamente', 'success');
                
            } catch (error) {
                console.error('❌ Error inicializando aplicación:', error);
                showToast('Error inicializando sistema: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        });

        // Initialize Data SDK
        async function initializeSDK() {
            try {
                setConnectionStatus('connecting');
                
                app.sdk = window.dataSdk;
                
                const result = await app.sdk.init({
                    onDataChanged: handleDataChanged
                });
                
                if (!result.isOk) {
                    throw new Error(result.error || 'Error inicializando SDK');
                }
                
                setConnectionStatus('connected');
                console.log('✅ SDK inicializado correctamente');
                
            } catch (error) {
                setConnectionStatus('error');
                console.error('❌ Error inicializando SDK:', error);
                throw error;
            }
        }

        // Handle data changes from SDK
        function handleDataChanged(data) {
            console.log('📊 Datos actualizados:', data.length, 'registros');
            app.data = data;
            
            // Update current section if visible
            if (document.getElementById('content-container').children.length > 0) {
                loadSection(app.currentSection, false); // Don't show loading
            }
            
            // Update stats
            updateStats();
        }

        // Enhanced setup event listeners
        function setupEventListeners() {
            // Tab navigation
            document.querySelectorAll('.tab-button').forEach(button => {
                button.addEventListener('click', (e) => {
                    const sectionName = e.target.id.replace('tab-', '');
                    loadSection(sectionName);
                });
            });

            // Quick actions for mobile
            const quickActionsBtn = document.getElementById('quick-actions-btn');
            const quickActionsMenu = document.getElementById('quick-actions-menu');
            
            if (quickActionsBtn) {
                quickActionsBtn.addEventListener('click', () => {
                    app.quickActionsVisible = !app.quickActionsVisible;
                    quickActionsMenu.classList.toggle('hidden', !app.quickActionsVisible);
                });
            }

            // Handle keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    switch(e.key) {
                        case 'r':
                            e.preventDefault();
                            refreshData();
                            break;
                        case 'n':
                            e.preventDefault();
                            if (app.currentSection !== 'dashboard') {
                                const addButton = document.querySelector(`#add-${app.currentSection}`);
                                if (addButton) addButton.click();
                            }
                            break;
                        case 'd':
                            e.preventDefault();
                            loadSection('dashboard');
                            break;
                    }
                }
                
                // Close quick actions on escape
                if (e.key === 'Escape' && app.quickActionsVisible) {
                    app.quickActionsVisible = false;
                    quickActionsMenu.classList.add('hidden');
                }
            });

            // Close quick actions when clicking outside
            document.addEventListener('click', (e) => {
                if (app.quickActionsVisible && !e.target.closest('#quick-actions-btn') && !e.target.closest('#quick-actions-menu')) {
                    app.quickActionsVisible = false;
                    quickActionsMenu.classList.add('hidden');
                }
            });
        }

        // Enhanced connection status
        function setConnectionStatus(status) {
            const statusEl = document.getElementById('connection-status');
            switch(status) {
                case 'connecting':
                    statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                    statusEl.title = 'Conectando...';
                    break;
                case 'connected':
                    statusEl.innerHTML = '<i class="fas fa-check-circle text-green-200"></i>';
                    statusEl.title = 'Conectado a SQLite';
                    break;
                case 'error':
                    statusEl.innerHTML = '<i class="fas fa-exclamation-circle text-red-200"></i>';
                    statusEl.title = 'Error de conexión';
                    break;
            }
        }

        // Enhanced load section with dashboard support
        async function loadSection(sectionName, showLoading = true) {
            try {
                if (showLoading) {
                    setLoading(true);
                }
                
                app.currentSection = sectionName;
                
                // Update active tab
                document.querySelectorAll('.tab-button').forEach(tab => {
                    tab.classList.remove('tab-active');
                    tab.classList.add('tab-inactive');
                });
                
                const activeTab = document.getElementById(`tab-${sectionName}`);
                if (activeTab) {
                    activeTab.classList.remove('tab-inactive');
                    activeTab.classList.add('tab-active');
                }
                
                // Load section content
                const content = await getSectionContent(sectionName);
                const container = document.getElementById('content-container');
                container.innerHTML = content;
                container.classList.add('fade-in');
                
                // Initialize section-specific functionality
                await initializeSection(sectionName);
                
            } catch (error) {
                console.error('❌ Error cargando sección:', error);
                showToast('Error cargando sección: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        }

        // Enhanced get section content with dashboard
        async function getSectionContent(sectionName) {
            switch(sectionName) {
                case 'dashboard':
                    return await getDashboardHTML();
                case 'proveedores':
                    return getProveedoresHTML();
                case 'categorias':
                    return getCategoriasHTML();
                case 'ubicaciones':
                    return getUbicacionesHTML();
                case 'productos':
                    return getProductosHTML();
                case 'variantes':
                    return getVariantesHTML();
                case 'inventario':
                    return getInventarioHTML();
                case 'transferencias':
                    return getTransferenciasHTML();
                case 'movimientos':
                    return getMovimientosHTML();
                case 'reportes':
                    return getReportesHTML();
                default:
                    return '<div class="text-center py-8"><p class="text-gray-500">Sección no encontrada</p></div>';
            }
        }

        // New Dashboard HTML
        async function getDashboardHTML() {
            return `
                <div class="space-y-6">
                    <!-- Welcome Section -->
                    <div class="card p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <h2 class="text-2xl font-bold text-gray-900">¡Bienvenido a XentraStock!</h2>
                                <p class="text-gray-600 mt-1">Gestiona tu inventario de forma inteligente y eficiente</p>
                            </div>
                            <div class="hidden sm:block">
                                <div class="bg-gradient-primary text-white px-4 py-2 rounded-lg">
                                    <div class="text-sm font-medium">${formatDateTime(new Date())}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Stats Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="card p-6 bg-gradient-to-br from-blue-50 to-blue-100 border-blue-200">
                            <div class="flex items-center">
                                <div class="p-3 bg-blue-500 rounded-lg">
                                    <i class="fas fa-cube text-white text-xl"></i>
                                </div>

        // Enhanced initialize section with dashboard
        async function initializeSection(sectionName) {
            switch(sectionName) {
                case 'dashboard':
                    await initDashboard();
                    break;
                case 'proveedores':
                    await initProveedores();
                    break;
                case 'categorias':
                    await initCategorias();
                    break;
                case 'ubicaciones':
                    await initUbicaciones();
                    break;
                case 'productos':
                    await initProductos();
                    break;
                case 'variantes':
                    await initVariantes();
                    break;
                case 'inventario':
                    await initInventario();
                    break;
                case 'transferencias':
                    await initTransferencias();
                    break;
                case 'movimientos':
                    await initMovimientos();
                    break;
                case 'reportes':
                    await initReportes();
                    break;
            }

        // New Dashboard initialization
        async function initDashboard() {
            try {
                // Update dashboard stats
                await updateDashboardStats();
                
                // Load recent activity
                await loadRecentActivity();
                
                // Initialize charts
                await initializeCharts();
                
            } catch (error) {
                console.error('Error inicializando dashboard:', error);
                showToast('Error cargando dashboard', 'error');
            }
        }

        // Update dashboard statistics
        async function updateDashboardStats() {
            try {
                const response = await fetch('/api/inventario/estadisticas');
                const result = await response.json();
                
                if (result.isOk) {
                    const stats = result.data;
                    document.getElementById('dashboard-productos').textContent = stats.totalProductos || 0;
                    document.getElementById('dashboard-variantes').textContent = stats.totalVariantes || 0;
                    document.getElementById('dashboard-stock-bajo').textContent = stats.productosStockBajo || 0;
                    
                    // Get today's movements
                    const movimientosResponse = await fetch('/api/movimientos/hoy');
                    const movimientosResult = await movimientosResponse.json();
                    document.getElementById('dashboard-movimientos').textContent = 
                        movimientosResult.isOk ? movimientosResult.data.length : 0;
                }
            } catch (error) {
                console.warn('Error actualizando estadísticas del dashboard:', error);
            }
        }

        // Load recent activity
        async function loadRecentActivity() {
            try {
                const response = await fetch('/api/movimientos?limit=5');
                const result = await response.json();
                
                const container = document.getElementById('recent-activity');
                
                if (result.isOk && result.data.length > 0) {
                    container.innerHTML = result.data.map(movimiento => `
                        <div class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg">
                            <div class="flex-shrink-0">
                                <i class="fas fa-${movimiento.tipo === 'ingreso' ? 'arrow-up text-green-500' : 'arrow-down text-red-500'}"></i>
                            </div>
                            <div class="flex-grow">
                                <p class="text-sm font-medium text-gray-900">${movimiento.tipo} - ${movimiento.cantidad} unidades</p>
                                <p class="text-xs text-gray-500">${formatDateTime(movimiento.fecha)}</p>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-gray-500 text-center py-4">No hay actividad reciente</p>';
                }
            } catch (error) {
                console.warn('Error cargando actividad reciente:', error);
                document.getElementById('recent-activity').innerHTML = 
                    '<p class="text-red-500 text-center py-4">Error cargando actividad</p>';
            }
        }

        // Initialize charts
        async function initializeCharts() {
            try {
                // Initialize category chart
                await initCategoryChart();
                
                // Initialize stock chart
                await initStockChart();
                
            } catch (error) {
                console.warn('Error inicializando gráficos:', error);
            }
        }

        // Initialize category chart
        async function initCategoryChart() {
            const ctx = document.getElementById('categoryChart');
            if (!ctx) return;
            
            try {
                const response = await fetch('/api/productos/por-categoria');
                const result = await response.json();
                
                if (result.isOk) {
                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: result.data.map(item => item.categoria || 'Sin categoría'),
                            datasets: [{
                                data: result.data.map(item => item.cantidad),
                                backgroundColor: [
                                    '#3B82F6', '#10B981', '#F59E0B', '#EF4444',
                                    '#8B5CF6', '#F97316', '#06B6D4', '#84CC16'
                                ],
                                borderWidth: 2,
                                borderColor: '#fff'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                }
                            }
                        }
                    });
                }
            } catch (error) {
                console.warn('Error creando gráfico de categorías:', error);
            }
        }

        // Initialize stock chart
        async function initStockChart() {
            const ctx = document.getElementById('stockChart');
            if (!ctx) return;
            
            try {

        // Enhanced update statistics
        async function updateStats() {
            try {
                const response = await fetch('/api/inventario/estadisticas');
                const result = await response.json();
                
                if (result.isOk) {
                    app.stats = {
                        totalProductos: result.data.totalProductos || 0,
                        totalVariantes: result.data.totalVariantes || 0,
                        stockBajo: result.data.productosStockBajo || 0
                    };
                    
                    // Update header stats
                    document.getElementById('total-productos').textContent = app.stats.totalProductos;
                    document.getElementById('total-variantes').textContent = app.stats.totalVariantes;
                    document.getElementById('stock-bajo').textContent = app.stats.stockBajo;

                        await updateDashboardStats();
                    }
                }
            } catch (error) {
                console.warn('Error actualizando estadísticas:', error);
            }

        // Enhanced refresh data
        async function refreshData() {
            try {
                setLoading(true);
                showToast('Actualizando datos...', 'info');
                
                if (app.sdk) {
                    await app.sdk.refreshData();
                }
                
                // Refresh current section
                await loadSection(app.currentSection, false);
                
                showToast('Datos actualizados correctamente', 'success');
                
            } catch (error) {
                console.error('Error refrescando datos:', error);
                showToast('Error actualizando datos: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }

        // Enhanced loading overlay
        function setLoading(loading) {
            app.isLoading = loading;
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = loading ? 'flex' : 'none';
        }

        // Enhanced toast notification system
        function showToast(message, type = 'info', duration = 4000) {
            const container = document.getElementById('toast-container');
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            // Add icon based on type
            let icon = '';
            switch(type) {
                case 'success':
                    icon = '<i class="fas fa-check-circle mr-2"></i>';
                    break;
                case 'error':
                    icon = '<i class="fas fa-exclamation-circle mr-2"></i>';
                    break;
                case 'warning':
                    icon = '<i class="fas fa-exclamation-triangle mr-2"></i>';
                    break;
                case 'info':
                default:
                    icon = '<i class="fas fa-info-circle mr-2"></i>';
                    break;
            }
            
            toast.innerHTML = icon + message;
            
            container.appendChild(toast);
            
            // Auto remove
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.style.animation = 'fadeOut 0.3s ease-out';
                    setTimeout(() => {
                        if (toast.parentNode) {
                            toast.parentNode.removeChild(toast);
                        }
                    }, 300);
                }
            }, duration);
        }

        // Enhanced utility functions
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('es-ES', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('es-ES', {
                style: 'currency',
                currency: 'EUR',
                minimumFractionDigits: 2
            }).format(amount);
        }

        function formatNumber(number) {
            return new Intl.NumberFormat('es-ES').format(number);
        }

        // Enhanced data filtering and searching
        function filterData(data, type, searchTerm = '') {
            let filtered = data.filter(item => item.tipo === type);
            
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(item => {
                    return Object.values(item).some(value => {
                        if (value === null || value === undefined) return false;
                        return String(value).toLowerCase().includes(term);
                    });
                });
            }
            
            return filtered;
        }

        // Enhanced modal system
        function createModal(title, content, options = {}) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            
            const modalContent = document.createElement('div');
            modalContent.className = `modal-content ${options.size || 'max-w-2xl'}`;
            
            modalContent.innerHTML = `
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-semibold text-gray-900">${title}</h3>
                    <button class="modal-close text-gray-400 hover:text-gray-600 transition-colors">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div class="modal-body">
                    ${content}
                </div>
            `;
            
            modal.appendChild(modalContent);
            document.body.appendChild(modal);
            
            // Close handlers
            const closeBtn = modal.querySelector('.modal-close');
            closeBtn.addEventListener('click', () => closeModal(modal));
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal(modal);
                }
            });
            
            // Escape key handler
            const escapeHandler = (e) => {
                if (e.key === 'Escape') {
                    closeModal(modal);
                    document.removeEventListener('keydown', escapeHandler);
                }
            };
            document.addEventListener('keydown', escapeHandler);
            
            return modal;
        }

        function closeModal(modal) {
            if (modal && modal.parentNode) {
                modal.style.animation = 'fadeOut 0.3s ease-out';
                setTimeout(() => {
                    if (modal.parentNode) {
                        modal.parentNode.removeChild(modal);
                    }
                }, 300);
            }
        }

        // Enhanced confirmation dialog
        function showConfirmDialog(message, onConfirm, options = {}) {
            const modal = createModal(
                options.title || 'Confirmar Acción',
                `
                <div class="text-center py-4">
                    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-yellow-100 mb-4">
                        <i class="fas fa-exclamation-triangle text-yellow-600 text-xl"></i>
                    </div>
                    <p class="text-gray-700 mb-6">${message}</p>
                    <div class="flex space-x-3 justify-center">
                        <button class="confirm-cancel btn-secondary px-6 py-2 rounded-lg">
                            ${options.cancelText || 'Cancelar'}
                        </button>
                        <button class="confirm-ok btn-primary px-6 py-2 rounded-lg">
                            ${options.confirmText || 'Confirmar'}
                        </button>
                    </div>
                </div>
                `,
                { size: 'max-w-md' }
            );
            
            modal.querySelector('.confirm-cancel').addEventListener('click', () => closeModal(modal));
            modal.querySelector('.confirm-ok').addEventListener('click', () => {
                onConfirm();
                closeModal(modal);
            });
        }

        // Enhanced error handling
        function handleApiError(error, context = '') {
            console.error(`API Error ${context}:`, error);
            
            let message = 'Ha ocurrido un error inesperado';
            
            if (error.message) {
                message = error.message;
            } else if (typeof error === 'string') {
                message = error;
            }
            
            showToast(`${context ? context + ': ' : ''}${message}`, 'error');
        }

        // Enhanced form validation
        function validateForm(formElement) {
            const errors = [];
            const requiredFields = formElement.querySelectorAll('[required]');
            
            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    errors.push(`${field.name || field.id} es requerido`);
                    field.classList.add('border-red-500');
                } else {
                    field.classList.remove('border-red-500');
                }
            });
            
            // Email validation
            const emailFields = formElement.querySelectorAll('input[type="email"]');
            emailFields.forEach(field => {
                if (field.value && !isValidEmail(field.value)) {
                    errors.push('El formato del email no es válido');
                    field.classList.add('border-red-500');
                }
            });
            
            // Number validation
            const numberFields = formElement.querySelectorAll('input[type="number"]');
            numberFields.forEach(field => {
                if (field.value && (isNaN(field.value) || parseFloat(field.value) < 0)) {
                    errors.push(`${field.name || field.id} debe ser un número válido`);
                    field.classList.add('border-red-500');
                }
            });
            
            return errors;
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Enhanced search functionality
        function setupSearchBox(inputElement, onSearch, placeholder = 'Buscar...') {
            inputElement.placeholder = placeholder;
            inputElement.classList.add('focus-ring');
            
            let searchTimeout;
            
            inputElement.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    onSearch(e.target.value);
                }, 300);
            });
            
            // Add search icon
            const container = inputElement.parentElement;
            if (!container.querySelector('.search-icon')) {
                const icon = document.createElement('div');
                icon.className = 'search-icon absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400';
                icon.innerHTML = '<i class="fas fa-search"></i>';
                container.classList.add('relative');
                container.appendChild(icon);
                inputElement.classList.add('pl-10');
            }
        }

        // Enhanced table functionality
        function createTable(data, columns, options = {}) {
            const table = document.createElement('table');
            table.className = 'table-modern w-full';
            
            // Create header
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            
            columns.forEach(column => {
                const th = document.createElement('th');
                th.textContent = column.title;
                th.className = 'text-left';
                if (column.sortable) {
                    th.classList.add('cursor-pointer', 'hover:bg-gray-100');
                    th.innerHTML += ' <i class="fas fa-sort text-gray-400 ml-1"></i>';
                }
                headerRow.appendChild(th);
            });
            
            thead.appendChild(headerRow);
            table.appendChild(thead);
            
            // Create body
            const tbody = document.createElement('tbody');
            
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                
                columns.forEach(column => {
                    const td = document.createElement('td');
                    
                    if (column.render) {
                        td.innerHTML = column.render(row[column.key], row, index);
                    } else {
                        td.textContent = row[column.key] || '';
                    }
                    
                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            });
            
            table.appendChild(tbody);
            
            return table;
        }

        // Add fadeOut animation for toast removal
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from { opacity: 1; transform: translateX(0); }
                to { opacity: 0; transform: translateX(100%); }
            }
        `;
        document.head.appendChild(style);

        // Performance optimization: debounce function
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Performance optimization: throttle function
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }
