    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
            to { box-shadow: 0 0 30px rgba(59, 130, 246, 0.8); }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes bounceGentle {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .glass-dark {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        
        .tab-active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            border-left: 4px solid #667eea;
            color: #667eea;
        }
        
        .tab-inactive {
            color: #64748b;
            transition: all 0.3s ease;
        }
        
        .tab-inactive:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            transform: translateX(5px);
        }
        
        .card-elegant {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .card-elegant:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .shimmer-effect {
            position: relative;
            overflow: hidden;
        }
        
        .shimmer-effect::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 2s infinite;
        }
        
        .floating-element {
            animation: float 6s ease-in-out infinite;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);

            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);

    </style>

    <script>
        // Global app state
        let currentTab = 'dashboard';
        let isLoading = false;

        // DOM Elements
        const sidebar = document.getElementById('sidebar');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mainContent = document.getElementById('main-content');
        const loadingOverlay = document.getElementById('loading-overlay');
        const toastContainer = document.getElementById('toast-container');

        // Mobile menu toggle
        mobileMenuBtn?.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });

        // Tab management
        function initTabs() {
            const tabButtons = document.querySelectorAll('.tab-button');
            
            tabButtons.forEach(button => {
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    const tabId = button.id.replace('tab-', '');
                    switchTab(tabId, button);
                });
            });
        }

        function switchTab(tabName, clickedButton) {
            if (isLoading) return;
            
            // Update tab states
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('tab-inactive');
            });
            
            clickedButton.classList.remove('tab-inactive');
            clickedButton.classList.add('tab-active');
            
            // Load content
            loadTabContent(tabName);
            currentTab = tabName;
            
            // Close mobile menu
            if (window.innerWidth < 1024) {
                sidebar.classList.add('-translate-x-full');
            }
        }

        function loadTabContent(tabName) {
            showLoading();
            
            setTimeout(() => {
                try {
                    let content = '';
                    
                    switch(tabName) {
                        case 'dashboard':
                            content = getDashboardHTML();
                            break;
                        case 'proveedores':
                            content = getProveedoresHTML();
                            break;
                        case 'categorias':
                            content = getCategoriasHTML();
                            break;
                        case 'ubicaciones':
                            content = getUbicacionesHTML();
                            break;
                        case 'productos':
                            content = getProductosHTML();
                            break;
                        case 'variantes':
                            content = getVariantesHTML();
                            break;
                        case 'inventario':
                            content = getInventarioHTML();
                            break;
                        case 'transferencias':
                            content = getTransferenciasHTML();
                            break;
                        case 'movimientos':
                            content = getMovimientosHTML();
                            break;
                        case 'reportes':
                            content = getReportesHTML();
                            break;
                        default:
                            content = getDashboardHTML();
                    }
                    
                    mainContent.innerHTML = content;
                    
                    // Initialize the specific module
                    initializeModule(tabName);
                    
                } catch (error) {
                    console.error('Error loading tab content:', error);
                    showToast('Error al cargar el contenido', 'error');
                } finally {
                    hideLoading();
                }
            }, 300);
        }

        function initializeModule(tabName) {
            try {
                switch(tabName) {
                    case 'dashboard':
                        if (typeof initDashboard === 'function') initDashboard();
                        break;
                    case 'proveedores':
                        if (typeof initProveedores === 'function') initProveedores();
                        break;
                    case 'categorias':
                        if (typeof initCategorias === 'function') initCategorias();
                        break;
                    case 'ubicaciones':
                        if (typeof initUbicaciones === 'function') initUbicaciones();
                        break;
                    case 'productos':
                        if (typeof initProductos === 'function') initProductos();
                        break;
                    case 'variantes':
                        if (typeof initVariantes === 'function') initVariantes();
                        break;
                    case 'inventario':
                        if (typeof initInventario === 'function') initInventario();
                        break;
                    case 'transferencias':
                        if (typeof initTransferencias === 'function') initTransferencias();
                        break;
                    case 'movimientos':
                        if (typeof initMovimientos === 'function') initMovimientos();
                        break;
                    case 'reportes':
                        if (typeof initReportes === 'function') initReportes();
                        break;
                }
            } catch (error) {
                console.error(`Error initializing ${tabName}:`, error);
            }
        }

        // Loading management
        function showLoading() {
            isLoading = true;
            loadingOverlay.classList.remove('hidden');
        }

        function hideLoading() {
            isLoading = false;
            loadingOverlay.classList.add('hidden');
        }

        // Toast notifications
        function showToast(message, type = 'info', duration = 3000) {
            const toast = document.createElement('div');
            toast.className = `glass rounded-xl px-6 py-4 text-white transform translate-x-full transition-transform duration-300 ease-out`;
            
            const bgColor = {
                success: 'from-green-500 to-emerald-600',
                error: 'from-red-500 to-rose-600',
                warning: 'from-yellow-500 to-orange-600',
                info: 'from-blue-500 to-indigo-600'
            }[type] || 'from-blue-500 to-indigo-600';
            
            toast.style.background = `linear-gradient(135deg, var(--tw-gradient-stops))`;
            toast.classList.add(`bg-gradient-to-r`, bgColor);
            
            const icon = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            }[type] || 'fas fa-info-circle';
            
            toast.innerHTML = `
                <div class="flex items-center space-x-3">
                    <i class="${icon}"></i>
                    <span class="font-medium">${message}</span>
                    <button onclick="this.parentElement.parentElement.remove()" class="ml-4 hover:bg-white/20 rounded p-1">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            
            toastContainer.appendChild(toast);
            
            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-x-full');
            }, 100);
            
            // Auto remove
            if (duration > 0) {
                setTimeout(() => {
                    toast.classList.add('translate-x-full');
                    setTimeout(() => toast.remove(), 300);
                }, duration);
            }
        }
